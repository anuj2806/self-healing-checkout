services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: self-healing-checkout-backend
    ports:
      - "8000:8000"
    environment:
      - APP_VERSION=v1.0.0
      - APP_ENV=production
      - AGENT_WEBHOOK_URL=http://agent-orchestrator:8001/webhook/incident
      - BACKEND_URL=http://localhost:8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  agent-orchestrator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: self-healing-checkout-agent
    command: ["python", "agent/incident_handler.py", "--listen", "--port", "8001", "--backend-url", "http://backend:8000"]
    ports:
      - "8001:8001"
    environment:
      - BACKEND_URL=http://backend:8000
      - APP_VERSION=v1.0.0
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: self-healing-checkout-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    restart: unless-stopped
